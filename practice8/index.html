<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Newsletter Subscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 class="title">Đăng ký nhận bản tin</h2>

  <form id="subscriptionForm">
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label>Subscription Type:</label><br>
    <input type="radio" name="type" value="Monthly"> Monthly
    <input type="radio" name="type" value="Yearly"> Yearly<br><br>

    <label>Interests:</label><br>
    <input type="checkbox" name="interest" value="Technology"> Technology<br>
    <input type="checkbox" name="interest" value="Books"> Books<br>
    <input type="checkbox" name="interest" value="Travel"> Travel<br><br>

    <button type="submit">Subscribe</button>
  </form>

  <p id="result"></p>

  <script src="script.js"></script>
</body>
</html>
